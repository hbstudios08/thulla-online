<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thulla Online</title>
  <link rel="canonical" href="https://thulla.online/">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
      background:linear-gradient(180deg,#12061f,#1d0a33);color:#f6f0ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    a{color:#ff4d6d;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Opening Thulla&hellip;</h1>
    <p id="msg">If nothing happens, <a href="/">go to the homepage</a>.</p>
  </main>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
  <script>
    (function () {
      var code = (new URLSearchParams(location.search).get("code") || "").trim();
      if (/^[A-Za-z0-9_-]{1,32}$/.test(code)) {
        // invite link: open the web game and join the room straight away
        location.replace("/?code=" + encodeURIComponent(code) + "&autoplay=1");
      } else if (location.pathname.indexOf("/join") === 0) {
        location.replace("/");
      } else {
        document.querySelector("h1").textContent = "Page not found";
      }
    })();
  </script>
</body>
</html>
