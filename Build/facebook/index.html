<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Thulla Multiplayer Voice</title>
    <!-- Include Facebook Instant Games SDK -->
    <script src="https://connect.facebook.net/en_US/fbinstant.6.3.js"></script>
    <style>
      body { margin: 0; padding: 0; background: #231F20; overflow: hidden; }
      #unity-container { width: 100%; height: 100%; position: absolute; }
      #unity-canvas { width: 100%; height: 100%; background: #231F20; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
      .unity-logo { width: 154px; height: 130px; background: url('logo.png') no-repeat center; }
      #unity-progress-bar-empty { width: 141px; height: 18px; margin-top: 10px; background: url('progress-bar-empty.png') no-repeat center; }
      #unity-progress-bar-full { width: 0%; height: 18px; background: url('progress-bar-full.png') no-repeat center; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div class="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>
  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/facebook.loader.js";
  var config = {
    dataUrl: buildUrl + "/facebook.data",
    frameworkUrl: buildUrl + "/facebook.framework.js",
    codeUrl: buildUrl + "/facebook.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "AHSTUDIOS",
    productName: "Thulla Multiplayer Voice",
    productVersion: "1.0.0",
  };

  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error("Failed to load " + src)); };
      document.body.appendChild(s);
    });
  }

  FBInstant.initializeAsync()
    .then(function () { return loadScript(loaderUrl); })
    .then(function () {
      return createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        progressBarFull.style.width = pct + "%";
        FBInstant.setLoadingProgress(pct);
      });
    })
    .then(function (unityInstance) {
      window.unityInstance = unityInstance;
      loadingBar.style.display = "none";
      FBInstant.setLoadingProgress(100);
      return FBInstant.startGameAsync();
    })
    .catch(function (err) {
      console.error("[Load] failed:", err);
      alert("Load error: " + (err && err.message ? err.message : err));
    });
</script>
  </body>
</html>
