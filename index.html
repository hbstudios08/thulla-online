<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thulla Online | Play the classic card game with friends</title>
  <meta name="description" content="Play Thulla online with friends. Free multiplayer card game with voice chat. Play instantly in your browser or download the app.">
  <meta name="theme-color" content="#14061f">
  <meta property="og:title" content="Thulla Online">
  <meta property="og:description" content="The classic card game, online with friends. Play instantly in your browser.">
  <meta property="og:type" content="website">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    :root{
      --bg1:#12061f; --bg2:#1d0a33;
      --red:#e11d48; --red-soft:#ff4d6d;
      --purple:#7c3aed; --purple-soft:#b57bff;
      --text:#f6f0ff; --muted:rgba(246,240,255,.68);
      --line:rgba(255,255,255,.14);
    }
    *{box-sizing:border-box;margin:0}
    html,body{height:100%}
    body{
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(225,29,72,.35), transparent 60%),
        radial-gradient(900px 600px at 95% 10%, rgba(124,58,237,.40), transparent 60%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      background-attachment:fixed;
      display:flex;flex-direction:column;min-height:100vh;
      padding-top:env(safe-area-inset-top,0);
    }
    main{flex:1;display:grid;place-items:center;padding:36px 20px 24px}
    .hero{width:100%;max-width:560px;text-align:center}

    /* card fan */
    .fan{display:flex;justify-content:center;height:150px;margin-bottom:6px}
    .pc{
      position:relative;width:88px;height:124px;margin:0 -12px;border-radius:12px;
      background:linear-gradient(160deg,#ffffff,#efe3fb);
      box-shadow:0 14px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.4) inset;
      display:grid;place-items:center;font-size:46px;transform-origin:50% 120%;
      animation:float 5s ease-in-out infinite;
    }
    .pc .rk{position:absolute;top:8px;left:10px;font-size:16px;font-weight:800;line-height:1}
    .pc:nth-child(1){transform:rotate(-16deg);color:#d4163c;animation-delay:0s}
    .pc:nth-child(2){transform:translateY(-10px);color:#4b1d96;z-index:2;animation-delay:.6s}
    .pc:nth-child(3){transform:rotate(16deg);color:#d4163c;animation-delay:1.2s}
    @keyframes float{
      0%,100%{translate:0 0} 50%{translate:0 -6px}
    }

    h1{
      font-size:clamp(44px,10vw,68px);font-weight:800;letter-spacing:-1px;line-height:1.05;
      background:linear-gradient(90deg,var(--red-soft),var(--purple-soft));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .tag{margin:12px auto 26px;max-width:420px;font-size:18px;line-height:1.5;color:var(--muted)}

    .play{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      width:100%;max-width:340px;padding:17px 24px;border-radius:16px;
      font-size:19px;font-weight:700;color:#fff;text-decoration:none;
      background:linear-gradient(135deg,var(--red),var(--purple));
      box-shadow:0 10px 34px rgba(190,40,120,.45);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .play:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(190,40,120,.6);filter:brightness(1.08)}
    .play:active{transform:translateY(0)}
    .note{margin-top:10px;font-size:13px;color:var(--muted)}

    .label{margin:34px 0 12px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto}
    .chip{
      display:flex;align-items:center;justify-content:center;gap:9px;
      padding:13px 12px;border-radius:14px;text-decoration:none;color:var(--text);
      font-weight:600;font-size:15px;
      background:rgba(255,255,255,.06);border:1px solid var(--line);
      backdrop-filter:blur(6px);
      transition:transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .chip:hover{transform:translateY(-2px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35)}
    .chip svg{width:20px;height:20px;fill:currentColor;flex:none}
    .chip .e{font-size:18px;line-height:1}
    .chip.red:hover{border-color:var(--red-soft)}
    .chip.purple:hover{border-color:var(--purple-soft)}

    footer{padding:18px 20px calc(18px + env(safe-area-inset-bottom,0));text-align:center;
      font-size:13px;color:var(--muted)}

    a:focus-visible{outline:3px solid var(--purple-soft);outline-offset:3px}
    @media (max-width:420px){.row{grid-template-columns:1fr}}
    @media (prefers-reduced-motion:reduce){.pc{animation:none}.play,.chip{transition:none}}
  </style>
  <script src="config.js"></script>
</head>
<body>
  <main>
    <section class="hero">
      <div class="fan" aria-hidden="true">
        <div class="pc"><span class="rk">A</span>♥</div>
        <div class="pc"><span class="rk">A</span>♠</div>
        <div class="pc"><span class="rk">A</span>♦</div>
      </div>

      <h1>Thulla</h1>
      <p class="tag">The classic card game, online with friends. Create a room, share the link and play.</p>

      <a class="play" id="play" href="/play.html" data-link="play">▶&nbsp; Play Instantly</a>
      <div class="note">No download needed. Runs in your browser.</div>

      <div class="label">Get the app</div>
      <div class="row">
        <a class="chip red" href="#" data-link="playStore" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.2c-.3.2-.5.6-.5 1.1v17.4c0 .5.2.9.5 1.1l9.8-9.8L3.6 2.2zm10.9 8.3 2.7-2.7L5.9 1.4l8.6 9.1zm0 3L5.9 22.6l11.3-6.4-2.7-2.7zm4.4-3.1-2.4-1.4-3 3 3 3 2.4-1.4c.7-.4.7-1.8 0-2.2z"/></svg>
          Google Play
        </a>
        <a class="chip purple" href="#" data-link="appStore" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.5 1.2 0 1.7-.8 3.1-.8s1.8.8 3.1.7c1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.3-.9-2.3-3.6zM14 5.4c.7-.8 1.100-1.900 1-3-1 0-2.100.7-2.800 1.500-.6.700-1.200 1.900-1 3 1.100.1 2.200-.6 2.800-1.500z"/></svg>
          App Store
        </a>
      </div>

      <div class="label">Join the community</div>
      <div class="row">
        <a class="chip red" href="#" data-link="whatsapp" target="_blank" rel="noopener">
          <span class="e" aria-hidden="true">💬</span> WhatsApp
        </a>
        <a class="chip purple" href="#" data-link="discord" target="_blank" rel="noopener">
          <span class="e" aria-hidden="true">🎮</span> Discord
        </a>
      </div>
    </section>
  </main>

  <footer>© AHSTUDIOS</footer>
</body>
</html>
