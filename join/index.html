<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a Thulla game</title>
  <link rel="shortcut icon" href="/TemplateData/favicon.ico">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1218;color:#f2f4f8}
    main{width:100%;max-width:380px;text-align:center}
    .mark{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;
      font-size:28px;font-weight:800;background:#2b6cff}
    h1{margin:0 0 6px;font-size:22px}
    p{margin:0 0 14px;opacity:.8;font-size:15px}
    .room{display:inline-block;margin-bottom:18px;padding:6px 14px;border-radius:999px;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
      letter-spacing:2px;font-weight:700}
    .room:empty{display:none}
    .btn{display:block;margin:8px 0;padding:13px 16px;border-radius:12px;text-decoration:none;
      font-weight:700;font-size:16px;background:#2b6cff;color:#fff}
    .btn.alt{background:transparent;border:1px solid rgba(255,255,255,.25)}
    .stores{margin-top:18px;font-size:13px;opacity:.8}
    .stores a{color:inherit;margin:0 6px}
  </style>
</head>
<body>
<main>
  <div class="mark">T</div>
  <h1>Joining Thulla</h1>
  <p id="msg">Opening the game…</p>
  <div class="room" id="room"></div>
  <a class="btn" id="web" href="/index.html">Play in browser</a>
  <a class="btn alt" id="app" href="#">Open in app</a>
  <div class="stores">
    Get the app:
    <a id="play" href="#">Google Play</a> · <a id="ios" href="#">App Store</a>
  </div>
</main>

<script>
(function () {
  // ===== EDIT THESE =====
  var CONFIG = {
    androidPackage: "YOUR.PACKAGE.NAME",
    webPlayer: "/index.html",       // your WebGL page
    param: "code",                  // query parameter carrying the room code
    scheme: "",                     // optional custom scheme (e.g. "thulla"); leave "" to use your https link
    playStore: "https://play.google.com/store/apps/details?id=YOUR.PACKAGE.NAME",
    appStore: "https://apps.apple.com/app/idYOUR_APP_ID",
    waitMs: 1800
  };
  // ======================

  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg");

  var code = (new URLSearchParams(location.search).get(CONFIG.param) ||
              new URLSearchParams(location.search).get("room") || "").trim();
  if (!/^[A-Za-z0-9_-]{1,32}$/.test(code)) code = "";
  $("room").textContent = code;

  var web = new URL(CONFIG.webPlayer, location.origin);
  if (code) web.searchParams.set(CONFIG.param, code);
  var webUrl = web.toString();

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isMobile = isAndroid || isIOS;

  // Android intent: opens the app if installed, else goes to the web player
  var qs = code ? "?" + CONFIG.param + "=" + encodeURIComponent(code) : "";
  var intentTarget = CONFIG.scheme
    ? "intent://join" + qs + "#Intent;scheme=" + CONFIG.scheme
    : "intent://" + location.host + location.pathname + qs + "#Intent;scheme=https";
  var androidIntent = intentTarget + ";package=" + CONFIG.androidPackage +
    ";S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";

  $("web").href = webUrl;
  $("play").href = CONFIG.playStore;
  $("ios").href = CONFIG.appStore;
  if (isAndroid) $("app").href = androidIntent;
  else if (isIOS && CONFIG.scheme) $("app").href = CONFIG.scheme + "://join" + qs;
  else $("app").style.display = "none";

  var went = false;
  function goWeb() {
    if (went) return;
    went = true;
    msg.textContent = "Starting the game in your browser…";
    location.replace(webUrl);
  }

  // Desktop: no app, go straight to the web player
  if (!isMobile) { setTimeout(goWeb, 400); return; }

  var left = false;
  document.addEventListener("visibilitychange", function () { if (document.hidden) left = true; });
  window.addEventListener("pagehide", function () { left = true; });
  window.addEventListener("blur", function () { left = true; });

  if (isAndroid) {
    location.href = androidIntent;
    setTimeout(function () { if (!left) goWeb(); }, CONFIG.waitMs);
  } else if (isIOS && CONFIG.scheme) {
    location.href = CONFIG.scheme + "://join" + qs;
    setTimeout(function () { if (!left) goWeb(); }, CONFIG.waitMs);
  } else {
    // iOS with Universal Links: if this page loaded, the app is not installed
    goWeb();
  }
})();
</script>
</body>
</html>
